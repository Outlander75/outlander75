<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#343d30"><link rel="manifest" href="manifest.json"><link rel="apple-touch-icon" href="icon.png"><title>ORYX 75</title><style>*{box-sizing:border-box}body{margin:0;background:#f5efe3;color:#343d30;font:16px system-ui}header{background:#343d30;color:#e7d7b9;padding:24px}header h1{margin:0;letter-spacing:4px}main{max-width:760px;margin:auto;padding:16px}nav{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0}button,input,select{font:inherit;border:1px solid #a49b82;border-radius:9px;padding:12px}button{background:#747c59;color:white;cursor:pointer}button.active{background:#343d30}section,article{background:#fffaf0;border:1px solid #ded3bd;border-radius:14px;padding:16px;margin:12px 0}label{display:block;margin:10px 0}input,select{width:100%;background:white;color:#343d30}h2,h3{margin:8px 0}small{color:#666} .big{font-size:34px;font-weight:700} .muted{color:#76684e} .danger{background:#854d40} .grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px} .grid article{margin:0} #msg{color:#854d40} </style></head><body><header><h1>ORYX 75</h1><div>EXPEDITION LOGBOOK · V1.0</div></header><main><nav id="nav"></nav><div id="view"></div><p id="msg" role="status"></p></main><script>
const KEY='oryx75-v1';const initial={fuel:[],maintenance:[],expenses:[],tasks:[]};let db;let page='Bord';const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const fmt=n=>Number(n).toLocaleString('fr-FR',{maximumFractionDigits:2});const money=n=>fmt(n)+' €';const today=()=>new Date().toLocaleDateString('sv-SE');function valid(d){return d&&['fuel','maintenance','expenses','tasks'].every(k=>Array.isArray(d[k]))&&d.tasks.every(x=>typeof x==='string')&&['fuel','maintenance','expenses'].every(k=>d[k].every(x=>x&&typeof x.id==='string'&&typeof x.date==='string'&&(k==='fuel'?Number.isFinite(x.km)&&x.km>=0&&Number.isFinite(x.liters)&&x.liters>0&&Number.isFinite(x.cost)&&x.cost>=0&&typeof x.full==='boolean':typeof x.name==='string'&&(k==='expenses'?Number.isFinite(x.cost)&&x.cost>=0:Number.isFinite(x.km)&&x.km>=0&&(x.cost===null||Number.isFinite(x.cost)&&x.cost>=0)))))}try{let raw=localStorage.getItem(KEY);db=raw?JSON.parse(raw):structuredClone(initial);if(!valid(db))throw Error('Données invalides')}catch(e){db=structuredClone(initial);$('msg').textContent='Lecture impossible : ne pas saisir avant restauration.';var blocked=true}function save(next){if(blocked)throw Error('Stockage bloqué : restaurez une sauvegarde.');localStorage.setItem(KEY,JSON.stringify(next));db=next}function odo(){return Math.max(0,...db.fuel.map(x=>x.km),...db.maintenance.map(x=>x.km))}function total(){return [...db.fuel,...db.maintenance,...db.expenses].reduce((s,x)=>s+(x.cost??0),0)}function stats(){let prev=null,l=0,c=0,last=null;for(const x of [...db.fuel].sort((a,b)=>a.km-b.km||a.date.localeCompare(b.date))){if(prev!==null){l+=x.liters;c+=x.cost}if(x.full){if(prev!==null&&x.km>prev)last={l:l*100/(x.km-prev),c:c*100/(x.km-prev)};prev=x.km;l=0;c=0}}return last}function field(n,t,type='text',v='',req=true){return `<label>${t}<input name="${n}" type="${type}" ${type==='text'&&['km','cost','liters','nextKm'].includes(n)?'inputmode="decimal"':''} value="${esc(v)}" ${req?'required':''}></label>`}function form(k,html){return `<section><form data-kind="${k}">${html}<button>Enregistrer</button></form></section>`}function records(k){return [...db[k]].sort((a,b)=>b.date.localeCompare(a.date)).map(x=>`<article><strong>${esc(x.name??(fmt(x.liters)+' L · '+(x.full?'plein complet':'partiel')))}</strong><p>${esc(x.date)} ${x.km!=null?' · '+fmt(x.km)+' km':''} ${x.cost!=null?' · '+money(x.cost):' · coût non renseigné'}</p>${x.nextKm||x.nextDate?`<small>Échéance : ${esc(x.nextKm??'')} ${esc(x.nextDate??'')}</small>`:''}<p><button class="danger" data-del="${k}" data-id="${esc(x.id)}">Supprimer</button></p></article>`).join('')||'<p>Aucune saisie.</p>'}function render(){ $('nav').innerHTML=['Bord','Carburant','Entretien','Budget','Réglages'].map(x=>`<button data-page="${x}" class="${page===x?'active':''}">${x}</button>`).join('');let s=stats();let h='';if(page==='Bord')h=`<section><small>TOYOTA HZJ75 · 1999 · 1HZ 4.2 D</small><div class="big">${fmt(odo())} km</div><small>Dernier kilométrage connu</small></section><div class="grid"><article><small>Dernière consommation</small><h3>${s?fmt(s.l)+' L/100 km':'—'}</h3></article><article><small>Dépenses enregistrées</small><h3>${money(total())}</h3></article></div><section><h2>À prévoir</h2>${db.tasks.map(x=>'<p>'+esc(x)+'</p>').join('')}${db.maintenance.filter(x=>x.nextKm||x.nextDate).map(x=>'<p>'+esc(x.name)+' · '+(x.nextKm?fmt(x.nextKm)+' km ':'')+esc(x.nextDate||'')+((x.nextKm&&x.nextKm<=odo())||(x.nextDate&&x.nextDate<=today())?' · Échéance atteinte':'')+'</p>').join('')}</section>`;if(page==='Carburant')h='<h2>Nouveau plein</h2>'+form('fuel',field('date','Date','date',today())+field('km','Compteur (km)','text',odo())+field('liters','Litres')+field('cost','Montant (€)')+'<label><input style="width:auto" type="checkbox" name="full" checked> Plein complet</label>')+`<section>Dernier intervalle complet : ${s?fmt(s.l)+' L/100 km · '+money(s.c)+'/100 km':'Deux pleins complets nécessaires'}</section>`+records('fuel');if(page==='Entretien')h='<h2>Nouvelle intervention</h2>'+form('maintenance',field('date','Date','date',today())+field('name','Intervention')+field('km','Compteur (km)','text',odo())+field('cost','Coût (€), facultatif','text','',false)+field('nextKm','Prochaine échéance (km)','text','',false)+field('nextDate','Prochaine échéance (date)','date','',false))+records('maintenance');if(page==='Budget')h=`<section><h2>Total enregistré : ${money(total())}</h2><p>Carburant et entretien inclus automatiquement. Ne pas les ressaisir ici.</p></section>`+form('expenses',field('date','Date','date',today())+field('name','Dépense / catégorie')+field('cost','Montant (€)'))+records('expenses');if(page==='Réglages')h='<section><h2>Sauvegarde</h2><p>Les données restent dans ce navigateur. Pas de synchronisation dans cette version.</p><button id="export">Exporter JSON</button><label>Restaurer une sauvegarde (remplace les données)<input id="import" type="file" accept=".json,application/json"></label></section><section>V1.0 · Prototype local. Les coûts historiques non connus ne sont pas comptabilisés.</section>'; $('view').innerHTML=h}function num(v,optional=false){if(optional&&!v.trim())return null;if(!/^\d+(?:[,.]\d+)?$/.test(v.trim()))throw Error('Nombre invalide');let n=Number(v.replace(',','.'));if(!Number.isFinite(n))throw Error('Nombre invalide');return n}document.addEventListener('submit',e=>{e.preventDefault();try{let f=e.target,k=f.dataset.kind,x=Object.fromEntries(new FormData(f));x.id=crypto.randomUUID?crypto.randomUUID():String(Date.now())+Math.random();x.cost=num(x.cost,k==='maintenance');if(k!=='expenses'){x.km=num(x.km);if(!Number.isInteger(x.km))throw Error('Kilométrage entier requis')}if(k==='fuel'){x.liters=num(x.liters);if(x.liters<=0)throw Error('Litres strictement positifs');x.full=f.full.checked}if(k==='maintenance'){x.nextKm=num(x.nextKm,true);if(x.nextKm!==null&&(!Number.isInteger(x.nextKm)||x.nextKm<=x.km))throw Error('Échéance kilométrique invalide')}if(x.name!==undefined&&!x.name.trim())throw Error('Libellé obligatoire');let d=structuredClone(db);d[k].push(x);save(d);render();$('msg').textContent='Enregistré.'}catch(err){$('msg').textContent=err.message}});document.addEventListener('click',e=>{let b=e.target.closest('button');if(!b)return;if(b.dataset.page){page=b.dataset.page;render()}if(b.dataset.del&&confirm('Supprimer cette ligne ?')){try{let d=structuredClone(db);d[b.dataset.del]=d[b.dataset.del].filter(x=>x.id!==b.dataset.id);save(d);render()}catch(err){$('msg').textContent=err.message}}if(b.id==='export'){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(db,null,2)],{type:'application/json'}));a.download='oryx75-'+today()+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}});document.addEventListener('change',async e=>{if(e.target.id!=='import')return;try{let d=JSON.parse(await e.target.files[0].text());if(!valid(d))throw Error('Sauvegarde invalide');if(confirm('Remplacer toutes les données locales ?')){localStorage.setItem(KEY,JSON.stringify(d));db=d;blocked=false;render();$('msg').textContent='Sauvegarde restaurée.'}}catch(err){$('msg').textContent=err.message}});render();if('serviceWorker'in navigator&&location.protocol==='https:')navigator.serviceWorker.register('./sw.js').catch(()=>{$('msg').textContent='Mode hors ligne non activé.'});</script></body></html>
